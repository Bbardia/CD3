name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            script: dist
            pattern: apps/desktop/release/*.dmg
          - os: ubuntu-latest
            name: Linux
            script: 'dist:linux'
            pattern: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
          - os: windows-latest
            name: Windows
            script: 'dist:win'
            pattern: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the app version from the tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --prefix apps/desktop
      - run: pnpm build
      - run: pnpm --filter @cd3/desktop ${{ matrix.script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CD3-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  npm:
    # Publishes @bbardia/cd3 via npm trusted publishing (OIDC): no stored token, provenance
    # attached. Requires the trusted publisher to be configured on npmjs.com for this repo
    # and workflow file; the very first publish happens locally with `npm publish`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Stamp the package version from the tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --prefix apps/cli
      - run: pnpm build
      # Trusted publishing needs a newer npm than the one bundled with Node 22.
      - run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: apps/cli

  release:
    # One job owns the release, so two concurrent packagers can never race to create it.
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
